apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: sac-tool
  labels:
    app: django-app
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080 # Port mở trực tiếp trên node K3s để Nginx ngoài trỏ vào
      protocol: TCP
      name: http
  selector:
    app: django-app
