apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: sac-tool
  labels:
    app: django-app
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30702 # Đổi sang 30702 (đồng bộ dải 30700 của sac-api, 30701 của sac-portal)
      protocol: TCP
      name: http
  selector:
    app: django-app
