apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
  namespace: sac-tool
  labels:
    app: django-app
spec:
  # Lưu ý: Do ứng dụng sử dụng SQLite cho database nội bộ (/data/db.sqlite3),
  # replicas nên duy trì ở mức 1 để tránh xung đột ghi/lock file SQLite.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: django-app
  template:
    metadata:
      labels:
        app: django-app
    spec:
      containers:
        - name: django-app
          image: 10.10.74.67:5000/sac-tool:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: django-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /admin/login/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /admin/login/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tool-data
              mountPath: /data
      volumes:
        - name: tool-data
          persistentVolumeClaim:
            claimName: tool-data-pvc
