name: SAGS CMS Continuous Integration & Deployment

on:
  push:
    branches:
      - main
      - dev

jobs:
  # 1. Static Linting check
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Debug DNS and Name Resolution
        run: |
          echo "=== DNS RESOLUTION DEBUG ==="
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf || true
          echo "=== /etc/hosts ==="
          cat /etc/hosts || true
          echo "=== PINGING GITEA SERVER ==="
          ping -c 1 10.10.74.67 || true
          echo "=== RESOLVING git.sgn.local ==="
          nslookup git.sgn.local || true
          getent hosts git.sgn.local || true

      - name: Checkout code
        run: |
          echo "10.10.74.67 git.sgn.local" | sudo tee -a /etc/hosts || echo "10.10.74.67 git.sgn.local" >> /etc/hosts
          git config --global http.sslVerify false
          export GIT_TERMINAL_PROMPT=0
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.sgn.local/${{ gitea.repository }}.git .
          git checkout ${{ gitea.sha }}
      
      - name: Verify Key Project Files
        run: |
          echo "=== VERIFYING KEY PROJECT FILES ==="
          [ -f package.json ] && echo "package.json check: PASSED" || (echo "Error: package.json not found"; exit 1)
          [ -f Dockerfile ] && echo "Dockerfile check: PASSED" || (echo "Error: Dockerfile not found"; exit 1)
          [ -d config ] && echo "config dir check: PASSED" || (echo "Error: config directory not found"; exit 1)

  # 2. Security scan (DevSecOps)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        run: |
          echo "10.10.74.67 git.sgn.local" | sudo tee -a /etc/hosts || echo "10.10.74.67 git.sgn.local" >> /etc/hosts
          git config --global http.sslVerify false
          export GIT_TERMINAL_PROMPT=0
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.sgn.local/${{ gitea.repository }}.git .
          git checkout ${{ gitea.sha }}

      - name: Secrets Leak Detection
        run: |
          echo "=== RUNNING SECRETS LEAK DETECTION ==="
          # Look for forbidden key phrases hardcoded in source
          FORBIDDEN_PATTERNS="api_key|client_secret|private_key"
          echo "Scanning source files for potential credentials..."
          LEAKS=$(grep -r -i -E "$FORBIDDEN_PATTERNS" src/ || true)
          if [ -n "$LEAKS" ]; then
            echo "⚠️ [WARNING] Potential hardcoded secrets found in source files:"
            echo "$LEAKS"
          else
            echo "🛡️ Secrets scan check: PASSED (No leaks found)"
          fi

      - name: Dockerfile Security Audit
        run: |
          echo "=== AUDITING DOCKERFILE ==="
          if grep -q "USER root" Dockerfile; then
            echo "⚠️ Security warning: App runs as root in Dockerfile."
          else
            echo "🛡️ Dockerfile check: PASSED (Non-root user verified)"
          fi

  # 3. Docker build and push to local registry
  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout code
        run: |
          echo "10.10.74.67 git.sgn.local" | sudo tee -a /etc/hosts || echo "10.10.74.67 git.sgn.local" >> /etc/hosts
          git config --global http.sslVerify false
          export GIT_TERMINAL_PROMPT=0
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.sgn.local/${{ gitea.repository }}.git .
          git checkout ${{ gitea.sha }}

      - name: Set Environment Variables
        run: |
          if [ "${{ gitea.ref_name }}" = "main" ]; then
            echo "IMAGE_TAG=prod-${{ gitea.sha }}" >> $GITHUB_ENV
            echo "IMAGE_LATEST=prod-latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev-${{ gitea.sha }}" >> $GITHUB_ENV
            echo "IMAGE_LATEST=dev-latest" >> $GITHUB_ENV
          fi

      - name: Build Container Image
        run: |
          echo "=== BUILDING DOCKER IMAGE ==="
          docker build \
            --build-arg REGISTRY_PREFIX=10.10.74.67:5000/ \
            --build-arg NODE_VERSION=20 \
            --build-arg NODE_ENV=production \
            --build-arg CACHE_BUST=$(date +%s) \
            -t 10.10.74.67:5000/sags/sags-cms:${{ env.IMAGE_TAG }} .
          docker tag 10.10.74.67:5000/sags/sags-cms:${{ env.IMAGE_TAG }} 10.10.74.67:5000/sags/sags-cms:${{ env.IMAGE_LATEST }}

      - name: Push to Local Registry
        run: |
          echo "=== PUSHING IMAGE TO LOCAL REGISTRY ==="
          docker push 10.10.74.67:5000/sags/sags-cms:${{ env.IMAGE_TAG }}
          docker push 10.10.74.67:5000/sags/sags-cms:${{ env.IMAGE_LATEST }}

  # 4. Deployment on K3s in sags-site namespace
  deploy:
    name: K3s Deployment
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        run: |
          echo "10.10.74.67 git.sgn.local" | sudo tee -a /etc/hosts || echo "10.10.74.67 git.sgn.local" >> /etc/hosts
          git config --global http.sslVerify false
          export GIT_TERMINAL_PROMPT=0
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.sgn.local/${{ gitea.repository }}.git .
          git checkout ${{ gitea.sha }}

      - name: Set Environment Variables
        run: |
          if [ "${{ gitea.ref_name }}" = "main" ]; then
            echo "IMAGE_TAG=prod-${{ gitea.sha }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev-${{ gitea.sha }}" >> $GITHUB_ENV
          fi

      - name: Deploy to K3s Cluster
        run: |
          echo "=== APPLYING K8S MANIFESTS ==="
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig.yaml
          sed -i "s|localhost|10.10.74.87|g" kubeconfig.yaml
          sed -i "s|127.0.0.1|10.10.74.87|g" kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
          
          # Create namespace if it does not exist
          kubectl create namespace sags-site --dry-run=client -o yaml | kubectl apply -f -
          
          # Substitute target image tag in deployment manifest
          sed -i "s|image: 10.10.74.67:5000/sags/sags-cms:latest|image: 10.10.74.67:5000/sags/sags-cms:${{ env.IMAGE_TAG }}|g" k8s/deployment.yaml
          
          # Apply ConfigMap, Ingress, Redis and Deployment resources
          kubectl apply -f k8s/redis.yml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Verify Deployment Health Status
        run: |
          echo "=== VERIFYING DEPLOYMENT ROLLOUT ==="
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout status deployment/sags-cms -n sags-site
