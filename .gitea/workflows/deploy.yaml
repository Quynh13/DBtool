name: Django Tool Continuous Integration & Deployment

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  REGISTRY_HOST: "10.10.74.67:5000"
  IMAGE_NAME: "sac-tool"
  K3S_SERVER_IP: "10.10.74.87"
  NAMESPACE: "sac-tool"

jobs:
  # -----------------------------------------------------------
  # 1. Kiểm tra cấu trúc source code
  # -----------------------------------------------------------
  lint:
    name: Code & Files Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: |
          echo "10.10.74.67 git.sgn.local" | sudo tee -a /etc/hosts || echo "10.10.74.67 git.sgn.local" >> /etc/hosts
          git config --global http.sslVerify false
          export GIT_TERMINAL_PROMPT=0
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.sgn.local/${{ gitea.repository }}.git .
          git checkout ${{ gitea.sha }}

      - name: Verify Key Project Files
        run: |
          echo "=== VERIFYING KEY PROJECT FILES ==="
          [ -f Dockerfile ] && echo "Dockerfile check: PASSED" || (echo "Error: Dockerfile not found"; exit 1)
          [ -f pyproject.toml ] && echo "pyproject.toml check: PASSED" || (echo "Error: pyproject.toml not found"; exit 1)
          [ -f manage.py ] && echo "manage.py check: PASSED" || (echo "Error: manage.py not found"; exit 1)
          [ -d config ] && echo "config dir check: PASSED" || (echo "Error: config directory not found"; exit 1)

  # -----------------------------------------------------------
  # 2. Build Docker Image và Push lên Local Registry
  # -----------------------------------------------------------
  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        run: |
          echo "10.10.74.67 git.sgn.local" | sudo tee -a /etc/hosts || echo "10.10.74.67 git.sgn.local" >> /etc/hosts
          git config --global http.sslVerify false
          export GIT_TERMINAL_PROMPT=0
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.sgn.local/${{ gitea.repository }}.git .
          git checkout ${{ gitea.sha }}

      - name: Set Environment Variables
        run: |
          if [ "${{ gitea.ref_name }}" = "main" ]; then
            echo "IMAGE_TAG=prod-${{ gitea.sha }}" >> $GITHUB_ENV
            echo "IMAGE_LATEST=prod-latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev-${{ gitea.sha }}" >> $GITHUB_ENV
            echo "IMAGE_LATEST=dev-latest" >> $GITHUB_ENV
          fi

      - name: Build Container Image
        run: |
          echo "=== BUILDING DOCKER IMAGE ==="
          docker build \
            -t ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_LATEST }}

      - name: Push to Local Registry
        run: |
          echo "=== PUSHING IMAGE TO LOCAL REGISTRY ==="
          docker push ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_LATEST }}

  # -----------------------------------------------------------
  # 3. Triển khai lên cụm K3s
  # -----------------------------------------------------------
  deploy:
    name: K3s Deployment
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        run: |
          echo "10.10.74.67 git.sgn.local" | sudo tee -a /etc/hosts || echo "10.10.74.67 git.sgn.local" >> /etc/hosts
          git config --global http.sslVerify false
          export GIT_TERMINAL_PROMPT=0
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.sgn.local/${{ gitea.repository }}.git .
          git checkout ${{ gitea.sha }}

      - name: Set Environment Variables
        run: |
          if [ "${{ gitea.ref_name }}" = "main" ]; then
            echo "IMAGE_TAG=prod-${{ gitea.sha }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev-${{ gitea.sha }}" >> $GITHUB_ENV
          fi

      - name: Deploy to K3s Cluster
        run: |
          echo "=== APPLYING K8S MANIFESTS ==="
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig.yaml
          sed -i "s|localhost|${{ env.K3S_SERVER_IP }}|g" kubeconfig.yaml
          sed -i "s|127.0.0.1|${{ env.K3S_SERVER_IP }}|g" kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

          # Tạo namespace nếu chưa tồn tại
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Thay thế tag image trong deployment manifest
          sed -i "s|image: ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest|image: ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g" k8s/deployment.yaml

          # Apply các tài nguyên
          [ -f k8s/configmap.yaml ] && kubectl apply -f k8s/configmap.yaml
          [ -f k8s/secret.yaml ] && kubectl apply -f k8s/secret.yaml
          [ -f k8s/pvc.yaml ] && kubectl apply -f k8s/pvc.yaml
          [ -f k8s/deployment.yaml ] && kubectl apply -f k8s/deployment.yaml
          [ -f k8s/service.yaml ] && kubectl apply -f k8s/service.yaml
          [ -f k8s/ingress.yaml ] && kubectl apply -f k8s/ingress.yaml

      - name: Verify Deployment Rollout Status
        run: |
          echo "=== VERIFYING DEPLOYMENT ROLLOUT ==="
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout status deployment/django-app -n ${{ env.NAMESPACE }} --timeout=180s
          kubectl get pods -l app=django-app -n ${{ env.NAMESPACE }}
